[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "membrane-propulsion"
version = "0.2.0"
description = "A synthetic Kuramoto-ring toy with a travelling drive, an assumed-law probe and a passive receiver sensor. Not propulsion, thrust or a space drive; stdlib-only."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Jean-François Brisson"}]
keywords = ["toy-model", "kuramoto", "synthetic", "reproducible"]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = []

[tool.setuptools]
py-modules = ["membrane_propulsion", "sensor", "rigor", "render_results"]
